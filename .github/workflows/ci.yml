name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          NODE_ENV: test
      - run: npm run test:official
      - run: npm run build
      - run: docker build -t newbot:ci .
      - name: Container readiness smoke (no model credentials)
        run: node scripts/container-smoke.mjs
