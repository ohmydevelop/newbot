name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:ui
      - run: npm run check
      - run: python3 scripts/test-deployment-database.py
      - run: npm test
        env:
          NODE_ENV: test
      - run: npm run test:official
      - run: npm run build
      - run: docker build -t newbot:ci .
      - name: Container readiness smoke (no model credentials)
        run: node scripts/container-smoke.mjs

  ui-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-cjk
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:ui-contracts
      - run: npm run test:mobile-contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-contract-evidence
          path: |
            .data/ui-verification/
            .data/mobile-verification/
            test-results/
